[package]
name = "tumblr"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
itoa = "1.0.14"
once_cell = "1.20.2"
reqwest = { version = "0.12.12", features = [ "http2", "json", "cookies" ], default-features = false }
scraper = { version = "0.22.0", default-features = false }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
thiserror = "2.0.11"
time = { version = "0.3.37", features = [ "serde" ] }
tokio = "1.43.0"

[dev-dependencies]
tokio = { version = "1.43.0", features = [ "macros" ] }

[features]
default = [ "rustls-tls" ]
native-tls = [ "reqwest/native-tls" ]
rustls-tls = [ "reqwest/rustls-tls" ]
